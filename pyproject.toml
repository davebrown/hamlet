[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamlet-mail"
version = "0.1.0"
description = "Private, reproducible email classification corpora"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hamlet = "hamlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
